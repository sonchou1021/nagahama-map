<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.css">

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>

<style>
html, body, #map {
  margin: 0;
  width: 100%;
  height: 100%;
}
#info {
  position: absolute;
  z-index: 10;
  background: white;
  padding: 10px;
  font-size: 13px;
  max-width: 90%;
}
</style>
</head>

<body>

<div id="info">PMTilesを確認中...</div>
<div id="map"></div>

<script>

const PMTILES_URL =
  "https://sonchou1021.github.io/nagahama-map/map.pmtiles";

async function start() {

  const p = new pmtiles.PMTiles(PMTILES_URL);

  // PMTilesのヘッダーを取得
  const h = await p.getHeader();

  document.getElementById("info").innerHTML =
    "PMTiles OK<br>" +
    "範囲: " +
    h.minLon.toFixed(5) + ", " +
    h.minLat.toFixed(5) + " ～ " +
    h.maxLon.toFixed(5) + ", " +
    h.maxLat.toFixed(5) + "<br>" +
    "中心: " +
    h.centerLon.toFixed(5) + ", " +
    h.centerLat.toFixed(5) + "<br>" +
    "Zoom: " + h.minZoom + " ～ " + h.maxZoom;

  // PMTilesをMapLibreに接続
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  // PMTiles自身が持っている中心座標を使用
  const map = new maplibregl.Map({
    container: "map",

    center: [
      h.centerLon,
      h.centerLat
    ],

    zoom: Math.max(12, h.minZoom),

    style: {
      version: 8,

      sources: {
        osm: {
          type: "vector",
          url: "pmtiles://" + PMTILES_URL
        }
      },

      layers: [

        {
          id: "background",
          type: "background",
          paint: {
            "background-color": "#eeeeee"
          }
        },

        {
          id: "water",
          type: "fill",
          source: "osm",
          "source-layer": "water",
          paint: {
            "fill-color": "#aadaff"
          }
        },

        {
          id: "landuse",
          type: "fill",
          source: "osm",
          "source-layer": "landuse",
          paint: {
            "fill-color": "#dddddd",
            "fill-opacity": 0.5
          }
        },

        {
          id: "roads",
          type: "line",
          source: "osm",
          "source-layer": "transportation",
          paint: {
            "line-color": "#ffffff",
            "line-width": 3
          }
        }

      ]
    }
  });

  map.addControl(new maplibregl.NavigationControl());

  map.on("error", function(e) {
    console.log(e);
    document.getElementById("info").innerHTML +=
      "<br><b>MAP ERROR:</b><br>" +
      JSON.stringify(e.error);
  });
}

start().catch(function(e) {

  document.getElementById("info").innerHTML =
    "<b>エラー</b><br>" +
    e.message;

  console.error(e);

});

</script>

</body>
</html>
