<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>長浜自作地図</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

const PMTILES_URL =
  "https://sonchou1021.github.io/nagahama-map/map.pmtiles";


// PMTilesをMapLibreで使用
const protocol = new pmtiles.Protocol({ metadata: true });

maplibregl.addProtocol("pmtiles", protocol.tile);


// 地図
const map = new maplibregl.Map({

  container: "map",

  center: [136.265, 35.38],

  zoom: 12,

  style: {

    version: 8,

    sources: {

      osm: {
        type: "vector",
        url: "pmtiles://" + PMTILES_URL
      }

    },

    layers: [

      // =========================
      // 背景
      // =========================

      {
        id: "background",
        type: "background",

        paint: {
          "background-color": "#f3f0e8"
        }
      },


      // =========================
      // 土地利用
      // =========================

      {
        id: "landuse",
        type: "fill",

        source: "osm",
        "source-layer": "landuse",

        paint: {
          "fill-color": [
            "match",
            ["get", "class"],

            "park", "#dcebd3",
            "wood", "#d6e6c8",
            "cemetery", "#e1ead9",
            "hospital", "#f0e0e0",
            "school", "#eee5c8",

            "#e8e4da"
          ],

          "fill-opacity": 0.7
        }
      },


      // =========================
      // 水域
      // =========================

      {
        id: "water",
        type: "fill",

        source: "osm",
        "source-layer": "water",

        paint: {
          "fill-color": "#a9d7e8"
        }
      },


      // =========================
      // 河川
      // =========================

      {
        id: "waterway",
        type: "line",

        source: "osm",
        "source-layer": "waterway",

        paint: {
          "line-color": "#8fc9df",
          "line-width": [
            "interpolate",
            ["linear"],
            ["zoom"],
            10, 0.5,
            12, 1,
            14, 2
          ]
        }
      },


      // =========================
      // 道路
      // =========================

      {
        id: "roads",

        type: "line",

        source: "osm",
        "source-layer": "transportation",

        paint: {

          "line-color": "#ffffff",

          "line-width": [

            "interpolate",
            ["linear"],
            ["zoom"],

            7, 0.5,
            10, 1,
            12, 2,
            13, 3,
            14, 5

          ]

        }
      },


      // =========================
      // 道路の縁
      // =========================

      {
        id: "roads-outline",

        type: "line",

        source: "osm",
        "source-layer": "transportation",

        paint: {

          "line-color": "#c8c4bc",

          "line-width": [

            "interpolate",
            ["linear"],
            ["zoom"],

            10, 1,
            12, 2.5,
            13, 4,
            14, 6

          ]

        }
      },


      // =========================
      // 建物
      // =========================

      {
        id: "building",

        type: "fill",

        source: "osm",
        "source-layer": "building",

        minzoom: 13,

        paint: {

          "fill-color": "#d7d2c9",

          "fill-outline-color": "#c2bdb5"

        }
      },


      // =========================
      // 道路名
      // =========================

      {
        id: "road-names",

        type: "symbol",

        source: "osm",
        "source-layer": "transportation_name",

        minzoom: 12,

        layout: {

          "text-field": [
            "coalesce",
            ["get", "name:ja"],
            ["get", "name"]
          ],

          "text-size": 11,

          "symbol-placement": "line"

        },

        paint: {

          "text-color": "#555555",

          "text-halo-color": "#ffffff",

          "text-halo-width": 1

        }

      },


      // =========================
      // 地名
      // =========================

      {
        id: "places",

        type: "symbol",

        source: "osm",
        "source-layer": "place",

        minzoom: 14,

        layout: {

          "text-field": [
            "coalesce",
            ["get", "name:ja"],
            ["get", "name"]
          ],

          "text-size": 14

        },

        paint: {

          "text-color": "#333333",

          "text-halo-color": "#ffffff",

          "text-halo-width": 1.5

        }

      },


      // =========================
      // POI
      // =========================

      {
        id: "poi",

        type: "symbol",

        source: "osm",
        "source-layer": "poi",

        minzoom: 14,

        layout: {

          "text-field": [
            "coalesce",
            ["get", "name:ja"],
            ["get", "name"]
          ],

          "text-size": 11

        },

        paint: {

          "text-color": "#444444",

          "text-halo-color": "#ffffff",

          "text-halo-width": 1

        }

      }

    ]

  }

});


// ナビゲーション
map.addControl(
  new maplibregl.NavigationControl(),
  "top-right"
);


// OSM attribution
map.addControl(
  new maplibregl.AttributionControl({
    compact: true
  })
);

</script>

</body>
</html>
