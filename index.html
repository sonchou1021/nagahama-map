<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.css">

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>

  <style>
    html,
    body,
    #map {
      margin: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <script>

    const PMTILES_URL =
      "https://sonchou1021.github.io/nagahama-map/map.pmtiles";

    const protocol = new pmtiles.Protocol();

    maplibregl.addProtocol(
      "pmtiles",
      protocol.tile
    );

    const map = new maplibregl.Map({

      container: "map",

      center: [
        136.26687,
        35.37768
      ],

      zoom: 13,

      style: {

        version: 8,

        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",

        sources: {

          osm: {
            type: "vector",
            url: "pmtiles://" + PMTILES_URL
          }

        },

        layers: [

          {
            id: "background",
            type: "background",

            paint: {
              "background-color": "#eeeeee"
            }
          },

          {

            id: "landuse",

            type: "fill",

            source: "osm",

            "source-layer": "landuse",

            paint: {

              "fill-color": "#e5e3df",

              "fill-opacity": 0.7

            }
          },

          {
            id: "water",
            type: "fill",

            source: "osm",

            "source-layer": "water",

            paint: {
              "fill-color": "#9fd3f0"
            }
          },

          {
            id: "waterway",
            type: "line",
            source: "osm",
            "source-layer": "waterway",
            paint: {
              "line-color": "#6bb7df",
              "line-width": 2
            }
          },

          {
            id: "building",
            type: "fill",
            source: "osm",
            "source-layer": "building",
            minzoom: 13,
            paint: {
              "fill-color": "#d8d4ce",
              "fill-outline-color": "#c5c1bb"
            }
          },

          {
            id: "roads",
            type: "line",
            source: "osm",
            "source-layer": "transportation",
            paint: {
              "line-color": [
                "match",
                ["get", "class"],
                "motorway", "#e89292",
                "trunk", "#e8a86b",
                "primary", "#f0c86b",
                "secondary", "#f3df8a",
                "tertiary", "#ffffff",
                "minor", "#ffffff",
                "service", "#dddddd",
                "#ffffff"
              ],
              "line-width": [
                "interpolate",
                ["linear"],
                ["zoom"],

                10, [
                  "match",
                  ["get", "class"],
                  "motorway", 3,
                  "trunk", 2.5,
                  "primary", 2,
                  "secondary", 1.7,
                  "tertiary", 1.4,
                  "minor", 1,
                  "service", 0.7,
                  1
                ],

                13, [
                  "match",
                  ["get", "class"],
                  "motorway", 6,
                  "trunk", 5,
                  "primary", 4,
                  "secondary", 3.5,
                  "tertiary", 3,
                  "minor", 2.5,
                  "service", 1.8,
                  2
                ],

                14, [
                  "match",
                  ["get", "class"],
                  "motorway", 9,
                  "trunk", 8,
                  "primary", 6,
                  "secondary", 5,
                  "tertiary", 4,
                  "minor", 3,
                  "service", 2,
                  3
                ]
              ]
            }
          },

          {
            id: "road-labels",
            type: "symbol",
            source: "osm",
            "source-layer": "transportation_name",

            layout: {
              "text-field": ["get", "name"],
              "text-size": 12,
              "symbol-placement": "line",
              "text-font": ["Noto Sans Regular"]
            },

            paint: {
              "text-color": "#555555",
              "text-halo-color": "#ffffff",
              "text-halo-width": 1.5
            }
          },

          {
            id: "place-labels",
            type: "symbol",
            source: "osm",
            "source-layer": "place",

            layout: {
              "text-field": ["get", "name"],
              "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],
                10, 10,
                13, 14,
                14, 16
              ]
            },

            paint: {
              "text-color": "#333333",
              "text-halo-color": "#ffffff",
              "text-halo-width": 2
            }
          },

          {
            id: "station-labels",
            type: "symbol",
            source: "osm",
            "source-layer": "poi",
            minzoom: 12,
            filter: [
              "==",
              ["get", "class"],
              "railway"
            ],
            layout: {
              "text-field": ["get", "name"],
              "text-size": 13
            },
            paint: {
              "text-color": "#333333",
              "text-halo-color": "#ffffff",
              "text-halo-width": 2
            }
          },

          {
            id: "poi-labels",
            type: "symbol",
            source: "osm",
            "source-layer": "poi",
            minzoom: 13,

            layout: {
              "text-field": ["get", "name"],
              "text-size": 11
            },

            paint: {
              "text-color": "#444444",
              "text-halo-color": "#ffffff",
              "text-halo-width": 1.5
            }
          }

        ]
      }

    });

    map.addControl(
      new maplibregl.NavigationControl()
    );

  </script>

</body>

</html>
