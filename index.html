<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.css">

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>

<style>
html, body, #map {
  margin: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

const PMTILES_URL =
"https://sonchou1021.github.io/nagahama-map/map.pmtiles";

const protocol = new pmtiles.Protocol();

maplibregl.addProtocol(
  "pmtiles",
  protocol.tile
);

const map = new maplibregl.Map({

  container: "map",

  center: [
    136.26687,
    35.37768
  ],

  zoom: 13,

  style: {

    version: 8,

    sources: {

      osm: {
        type: "vector",
        url: "pmtiles://" + PMTILES_URL
      }

    },

    layers: [

      {
        id: "background",
        type: "background",

        paint: {
          "background-color": "#eeeeee"
        }
      },

      {

      id: "landuse",

      type: "fill",

      source: "osm",

        "source-layer": "landuse",

      paint: {

        "fill-color": "#e5e3df",

        "fill-opacity": 0.7

        }
      },

      {
        id: "water",
        type: "fill",

        source: "osm",

        "source-layer": "water",

        paint: {
          "fill-color": "#9fd3f0"
        }
      },

      {
        id: "building",
        type: "fill",
        source: "osm",
          "source-layer": "building",
        minzoom: 13,
        paint: {
          "fill-color": "#d8d4ce",
          "fill-outline-color": "#c5c1bb"
        }
      },

      {
        id: "roads",
        type: "line",

        source: "osm",

        "source-layer": "transportation",

        paint: {
          "line-color": "#ffffff",
          "line-width": 3
        }
      }

    ]

  }

});

map.addControl(
  new maplibregl.NavigationControl()
);

</script>

</body>
</html>
