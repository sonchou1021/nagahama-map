<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>長浜自作地図</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>
  // PMTilesをMapLibreで読めるようにする
  const protocol = new pmtiles.Protocol({ metadata: true });
  maplibregl.addProtocol("pmtiles", protocol.tile);

  // 自作PMTiles
  const PMTILES_URL =
    "https://sonchou1021.github.io/nagahama-map/map.pmtiles";

  const map = new maplibregl.Map({
    container: "map",

    center: [136.265, 35.38],
    zoom: 12,

    style: {
      version: 8,

      sources: {
        osm: {
          type: "vector",
          url: "pmtiles://" + PMTILES_URL,
          attribution:
            "© OpenStreetMap contributors © OpenMapTiles"
        }
      },

      layers: [

        // 背景
        {
          id: "background",
          type: "background",
          paint: {
            "background-color": "#f2efe9"
          }
        },

        // 水域
        {
          id: "water",
          type: "fill",
          source: "osm",
          "source-layer": "water",
          paint: {
            "fill-color": "#a8d8ea"
          }
        },

        // 土地利用
        {
          id: "landuse",
          type: "fill",
          source: "osm",
          "source-layer": "landuse",
          paint: {
            "fill-color": "#e5eadf",
            "fill-opacity": 0.7
          }
        },

        // 建物
        {
          id: "building",
          type: "fill",
          source: "osm",
          "source-layer": "building",
          minzoom: 13,
          paint: {
            "fill-color": "#d8d2c8",
            "fill-outline-color": "#c5bfb5"
          }
        },

        // 道路
        {
          id: "roads",
          type: "line",
          source: "osm",
          "source-layer": "transportation",
          paint: {
            "line-color": "#ffffff",
            "line-width": [
              "interpolate",
              ["linear"],
              ["zoom"],
              10, 0.5,
              12, 1,
              14, 2,
              16, 5
            ]
          }
        },

        // 道路名
        {
          id: "road-names",
          type: "symbol",
          source: "osm",
          "source-layer": "transportation_name",
          minzoom: 13,
          layout: {
            "text-field": ["get", "name"],
            "text-size": 11
          },
          paint: {
            "text-color": "#555555",
            "text-halo-color": "#ffffff",
            "text-halo-width": 1
          }
        },

        // 地名
        {
          id: "places",
          type: "symbol",
          source: "osm",
          "source-layer": "place",
          layout: {
            "text-field": ["get", "name"],
            "text-size": [
              "interpolate",
              ["linear"],
              ["zoom"],
              10, 10,
              14, 14
            ]
          },
          paint: {
            "text-color": "#333333",
            "text-halo-color": "#ffffff",
            "text-halo-width": 1.5
          }
        }

      ]
    }
  });
</script>

</body>
</html>
